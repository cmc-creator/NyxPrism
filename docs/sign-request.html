<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Document - NyxPrism</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#05070d;--surface:#0f1724;--surface2:#141e2e;--border:#213049;--accent:#7c3aed;--accent2:#22c55e;--gold:#facc15;--text:#f0f4fc;--text2:#c8d3e0;--muted:#7f96b2;--red:#f87171;--green:#34d399}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#04070d,#07111d 45%,#09070f);color:var(--text);font-family:Inter,system-ui,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(115deg,rgba(124,58,237,.18),transparent 30%),linear-gradient(245deg,rgba(34,197,94,.12),transparent 32%)}
    header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;border-bottom:1px solid rgba(167,139,250,.14);background:rgba(5,7,13,.72);backdrop-filter:blur(22px)}.brand{font-weight:900;letter-spacing:-.03em}.brand em{font-style:normal;color:#a78bfa}.status{font-size:.78rem;color:var(--muted)}
    main{max-width:1180px;margin:0 auto;padding:1.5rem;display:grid;grid-template-columns:1fr 320px;gap:1rem}.card{background:linear-gradient(180deg,rgba(15,23,36,.9),rgba(11,16,26,.86));border:1px solid rgba(167,139,250,.14);border-radius:14px;padding:1rem;box-shadow:0 18px 60px rgba(0,0,0,.25)}h1{font-size:1.25rem;margin:.2rem 0 .35rem}p{color:var(--muted);font-size:.88rem;line-height:1.55}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:.55rem .9rem;background:linear-gradient(135deg,var(--accent),#5b21b6);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}.btn:disabled{opacity:.45;cursor:not-allowed}.stage{position:relative;display:inline-block;max-width:100%;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--border)}canvas{display:block;max-width:100%}.field{position:absolute;border:2px solid var(--gold);background:rgba(250,204,21,.16);color:#111827;border-radius:5px;padding:.25rem .35rem;font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}.field.done{border-color:var(--green);background:rgba(52,211,153,.18)}.field.required:after{content:"*";color:#b91c1c;margin-left:.15rem}.field-list{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem}.field-row{border:1px solid var(--border);border-radius:8px;padding:.65rem;background:var(--surface2);font-size:.84rem}.field-row strong{display:block;margin-bottom:.25rem}.field-row span{color:var(--muted)}input[type=text]{width:100%;margin-top:.5rem;padding:.55rem .65rem;border-radius:7px;border:1px solid var(--border);background:#080d16;color:var(--text);font-family:inherit}.result{display:none;margin-top:.75rem;border-radius:8px;padding:.75rem;font-size:.86rem}.result.ok{display:block;background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.25)}.result.err{display:block;background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.25)}@media(max-width:900px){main{grid-template-columns:1fr}.card.side{order:-1}}
  </style>
  <link rel="stylesheet" href="nyx-brand.css?v=2" />
  <script src="nyx-brand.js?v=2" defer></script>
</head>
<body>
<header>
  <a href="index.html" class="brand nyx-brand-lockup">
    <span class="nyx-brand-icon"><canvas class="nyx-prism-mark" aria-hidden="true"></canvas></span>
    <span class="nyx-brand-copy"><span class="nyx-brand-wordmark"><em>Nyx</em>Prism&#8482;</span><span class="nyx-brand-company">by NyxCollective LLC</span></span>
  </a>
  <div class="status" id="status">Loading secure signing link...</div>
</header>
<main>
  <section class="card"><div class="viewer-head"><div><h1 id="doc-title">Document</h1><p id="doc-sub">Review each field, complete the required entries, then submit.</p></div><div><button class="btn secondary" id="prev-page">Prev</button> <button class="btn secondary" id="next-page">Next</button></div></div><div class="stage" id="stage"><canvas id="pdf-canvas"></canvas></div></section>
  <aside class="card side"><h1>Your Fields</h1><p id="recipient-line"></p><div id="field-list" class="field-list"></div><label style="display:flex;align-items:flex-start;gap:.55rem;margin-top:1rem;color:var(--text2);font-size:.78rem;line-height:1.45"><input type="checkbox" id="sign-consent" style="margin-top:.2rem" />I consent to use electronic records and agree that submitting these fields constitutes my electronic signature.</label><button class="btn" id="complete-btn" style="width:100%;margin-top:1rem">Complete Signing</button><button class="btn secondary" id="decline-btn" style="width:100%;margin-top:.6rem">Decline Request</button><button class="btn secondary" id="download-signed" style="width:100%;margin-top:.6rem;display:none">Download My Signed Copy</button><div id="result" class="result"></div></aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/@cantoo/pdf-lib/dist/pdf-lib.min.js"></script>
<script>
const API='https://nyxprism-production.up.railway.app';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const token=new URLSearchParams(location.search).get('token');
const state={pdf:null,page:1,data:null,values:new Map(),signedBlob:null};
const canvas=document.getElementById('pdf-canvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),result=document.getElementById('result');
function show(cls,msg){result.className='result '+cls;result.textContent=msg;}
function valueFor(field){return state.values.get(Number(field.id))||field.value_text||'';}
async function render(){if(!state.pdf)return;const page=await state.pdf.getPage(state.page);const vp=page.getViewport({scale:1.15});canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:ctx,viewport:vp}).promise;stage.querySelectorAll('.field').forEach(el=>el.remove());state.data.fields.filter(f=>Number(f.page_number)===state.page).forEach(field=>{const el=document.createElement('div');el.className='field '+(field.required?'required ':'')+(valueFor(field)?'done':'');el.style.left=(Number(field.x)*canvas.offsetWidth)+'px';el.style.top=(Number(field.y)*canvas.offsetHeight)+'px';el.style.width=(Number(field.width)*canvas.offsetWidth)+'px';el.style.height=(Number(field.height)*canvas.offsetHeight)+'px';el.textContent=valueFor(field)||field.label||field.field_type;el.addEventListener('click',()=>focusField(field.id));stage.appendChild(el);});document.getElementById('status').textContent='Page '+state.page+' / '+state.pdf.numPages;}
function focusField(id){const input=document.querySelector('[data-field-input="'+id+'"]');if(input){input.focus();input.scrollIntoView({block:'center',behavior:'smooth'});}}
function renderFields(){const list=document.getElementById('field-list');list.replaceChildren();state.data.fields.forEach(field=>{const row=document.createElement('div');row.className='field-row';const strong=document.createElement('strong');strong.textContent=(field.label||field.field_type)+' · page '+field.page_number+(field.required?' *':'');const type=document.createElement('span');type.textContent=field.field_type;const input=document.createElement('input');input.type='text';input.dataset.fieldInput=String(field.id);input.placeholder='Enter '+field.field_type;input.value=String(valueFor(field));input.addEventListener('input',()=>{state.values.set(Number(field.id),input.value);render();});row.append(strong,type,input);list.appendChild(row);});}
async function load(){if(!token){show('err','Missing signing token.');return;}try{const res=await fetch(API+'/api/sign-requests/public/'+token);const data=await res.json();if(!res.ok)throw new Error(data.error||'Unable to load request');state.data=data;document.getElementById('doc-title').textContent=data.request.title;document.getElementById('doc-sub').textContent=data.request.documentName;document.getElementById('recipient-line').textContent='Signing as '+data.recipient.name+' ('+data.recipient.email+')';state.pdf=await pdfjsLib.getDocument({data:Uint8Array.from(atob(data.documentBase64.split(',').pop()),c=>c.charCodeAt(0))}).promise;renderFields();await render();}catch(err){show('err',err.message);}}
document.getElementById('prev-page').addEventListener('click',()=>{if(state.pdf&&state.page>1){state.page--;render();}});document.getElementById('next-page').addEventListener('click',()=>{if(state.pdf&&state.page<state.pdf.numPages){state.page++;render();}});
async function buildSignedPdf(){
  const PDFLib=window.PDFLib;if(!PDFLib)throw new Error('PDF engine failed to load.');
  const bytes=Uint8Array.from(atob(state.data.documentBase64.split(',').pop()),c=>c.charCodeAt(0));
  const doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const font=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
  const pages=doc.getPages();
  for(const field of state.data.fields){
    const value=valueFor(field);if(!value)continue;
    const page=pages[Number(field.page_number)-1];if(!page)continue;
    const size=page.getSize();const x=Number(field.x)*size.width;const boxH=Number(field.height)*size.height;const y=size.height-(Number(field.y)*size.height)-boxH+4;
    const text=field.field_type==='checkbox'?'X':value;
    const fontSize=Math.max(9,Math.min(18,boxH*.52));
    page.drawText(text,{x:x+4,y,font,size:fontSize,color:PDFLib.rgb(.08,.09,.12)});
  }
  const out=await doc.save();return new Blob([out],{type:'application/pdf'});
}
document.getElementById('download-signed').addEventListener('click',()=>{if(!state.signedBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(state.signedBlob);a.download=(state.data.request.documentName||'signed-document.pdf').replace(/\.pdf$/i,'')+'-signed.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);});
document.getElementById('complete-btn').addEventListener('click',async function(){if(!state.data)return;if(!document.getElementById('sign-consent').checked){show('err','Confirm electronic-signature consent before completing.');return;}this.disabled=true;try{const values=state.data.fields.map(f=>({fieldId:f.id,value:valueFor(f)}));const res=await fetch(API+'/api/sign-requests/public/'+token+'/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values,consent:true})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Unable to complete request');state.signedBlob=await buildSignedPdf();document.getElementById('download-signed').style.display='block';show('ok','Thank you. Your consent and fields were recorded. Download your recipient copy below.');}catch(err){show('err',err.message);}finally{this.disabled=false;}});
document.getElementById('decline-btn').addEventListener('click',async function(){if(!state.data)return;const reason=prompt('Optional reason for declining:')||'';if(!confirm('Decline this signature request?'))return;this.disabled=true;try{const res=await fetch(API+'/api/sign-requests/public/'+token+'/decline',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Unable to decline request');document.getElementById('complete-btn').disabled=true;show('ok','Signature request declined.');}catch(err){show('err',err.message);}finally{this.disabled=false;}});
load();
</script>
</body>
</html>
